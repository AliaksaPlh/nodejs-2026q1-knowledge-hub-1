networks:
  knowledge_hub:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - knowledge_hub
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_hub}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-knowledge_hub}\" -d \"${POSTGRES_DB:-knowledge_hub}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    networks:
      - knowledge_hub
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://knowledge_hub:knowledge_hub@db:5432/knowledge_hub?schema=public}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f \"http://localhost:${PORT:-4000}/\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  adminer:
    image: adminer:latest
    profiles:
      - debug
    restart: "no"
    networks:
      - knowledge_hub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
